<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Harbor Coffee</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .promo-banner { background: #fdf2e9; padding: 12px 24px; }
    #opening-hours { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="main-nav">
      <a class="main-nav__link main-nav__link--active" href="/">Menu</a>
      <a class="main-nav__link" href="/visit">Visit</a>
    </nav>
  </header>
  <main class="container">
    <section class="promo-banner">Fresh beans every Monday.</section>
    <div class="grid grid--3">
      <article class="card card--featured">
        <h2 class="card__title">Flat white</h2>
        <p class="card__body">Double shot, steamed milk.</p>
        <button class="btn btn-primary">Order</button>
      </article>
      <article class="card">
        <h2 class="card__title">Cold brew</h2>
        <p class="card__body">Steeped 18 hours.</p>
        <button class="btn btn-outline">Order</button>
      </article>
    </div>
    <table id="opening-hours" class=""></table>
  </main>
  <footer class="site-footer"></footer>
</body>
</html>
